[project]
name = "testing"
version = "1.0.0"
description = "A repository supporting testing."
packages = []
authors = []
dependencies = [
    "oarepo[s3,rdm]>=14.0.0b1,<15.0.0",
    "oarepo-app[ccmm,production]>=2.0.0,<3.0.0",
    "oarepo-model>=2.4.0",
]
requires-python = ">=3.14,<3.15"

[project.entry-points."invenio_assets.webpack"]
i18n = "i18n.webpack:theme"
components = "ui.components.webpack:theme"
ui_test_record = "ui.test_record.webpack:theme"

[project.entry-points."invenio_i18n.translations"]
translations = "i18n"

[project.entry-points."invenio_db.alembic"]
repository = "common:alembic"

[project.entry-points."invenio_base.blueprints"]
ui_test_record = "ui.test_record:create_blueprint"

[project.entry-points."invenio_base.finalize_app"]
ui_test_record = "ui.test_record:finalize_app"

[[tool.uv.index]]
url = "https://gitlab.cesnet.cz/api/v4/projects/1408/packages/pypi/simple"

[tool.uv.build-backend]
module-root = ""
module-name = [
    "common",
    "i18n",
    "ui",
    "test_record",
]

[build-system]
requires = [
    "uv_build>=0.8.7,<0.9.0",
]
build-backend = "uv_build"

# Fork overrides — billyziege patches for packages with upstream bugs.
# oarepo-model: fixes pid-relation circular-import bug (PLT-021-a).
# ccmm-invenio 1.1.6 accepts oarepo-model 2.x natively; no fork needed for it.
[tool.uv.sources]
oarepo-model = { git = "https://github.com/billyziege/oarepo-model", branch = "zerbe_patching_to_get_dantec_working" }
